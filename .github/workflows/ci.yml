
name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint et tests
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verifier le code avec Ruff
        run: python -m ruff check .

      - name: Executer les tests Pytest
        run: python -m pytest -v

  build-push:
    name: Build Docker et publication GHCR
    runs-on: ubuntu-latest
    needs: lint-test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generer le tag de l'image
        id: metadata
        shell: bash
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "tag=${TIMESTAMP}-${SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Connexion a GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.tag }}
